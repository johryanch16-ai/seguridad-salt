<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <!-- Soft cloth shadow for authentic uniform depth -->
    <filter id="clothShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="1" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.45" />
    </filter>

    <!-- Natural fabric shading gradient to look rounded on the sleeve -->
    <linearGradient id="sleeveLighting" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.18" />
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.0" />
      <stop offset="80%" stop-color="#000000" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.45" />
    </linearGradient>

    <!-- Arched text paths -->
    <path id="topArc" d="M 80,250 A 170,170 0 0,1 420,250" fill="none" />
    <path id="botArc" d="M 420,250 A 170,170 0 0,1 80,250" fill="none" />
  </defs>

  <g filter="url(#clothShadow)">
    <!-- Outer Merrowed Edge (Black embroidered seam) -->
    <circle cx="250" cy="250" r="236" fill="#121318" stroke="#1F2128" stroke-width="12" />
    <!-- Fine stitch accents -->
    <circle cx="250" cy="250" r="236" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="4,4" opacity="0.35" />

    <!-- Main Twill Red Background -->
    <circle cx="250" cy="250" r="226" fill="#A81424" />

    <!-- Gold/Silver Stitched Border Rings -->
    <circle cx="250" cy="250" r="218" fill="none" stroke="#F5D061" stroke-width="3.5" stroke-dasharray="6,3" />
    <circle cx="250" cy="250" r="136" fill="none" stroke="#F5D061" stroke-width="3.5" stroke-dasharray="6,3" />

    <!-- Arch Text: SEGURIDAD -->
    <text font-family="'Outfit', 'Impact', Arial, sans-serif" font-weight="900" font-size="34" fill="#FFFFFF" letter-spacing="5">
      <textPath href="#topArc" xlink:href="#topArc" startOffset="50%" text-anchor="middle">
        SEGURIDAD
      </textPath>
    </text>

    <!-- Arch Text: COSTA RICA -->
    <text font-family="'Outfit', 'Impact', Arial, sans-serif" font-weight="900" font-size="23" fill="#FFFFFF" letter-spacing="5" opacity="0.95">
      <textPath href="#botArc" xlink:href="#botArc" startOffset="50%" text-anchor="middle">
        COSTA RICA
      </textPath>
    </text>

    <!-- Center Circle: Official SALT Emblem -->
    <circle cx="250" cy="250" r="128" fill="#0B0C10" stroke="#FFFFFF" stroke-width="3" />

    <!-- Emblem Left: Crimson Red -->
    <path d="M 250,122 A 128,128 0 0,0 250,378 Z" fill="#B01221" />
    <!-- Emblem Right: Obsidian -->
    <path d="M 250,122 A 128,128 0 0,1 250,378 Z" fill="#090A0D" />

    <!-- White Horizon Curve -->
    <path d="M 122,305 Q 250,265 378,305 Q 250,272 122,305 Z" fill="#FFFFFF" />

    <!-- Left Building -->
    <path d="M 185,290 L 218,278 L 218,378 L 185,368 Z" fill="#090A0D" />
    <path d="M 218,278 L 232,284 L 232,378 L 218,378 Z" fill="#FFFFFF" />
    <rect x="196" y="298" width="6" height="16" fill="#E52335" rx="1" />
    <rect x="196" y="324" width="6" height="18" fill="#E52335" rx="1" />

    <!-- Center Main Skyscraper -->
    <path d="M 232,228 L 255,212 L 255,378 L 232,378 Z" fill="#090A0D" />
    <path d="M 255,212 L 282,228 L 282,378 L 255,378 Z" fill="#FFFFFF" />
    <rect x="261" y="242" width="8" height="16" fill="#090A0D" rx="1" />
    <rect x="261" y="268" width="8" height="16" fill="#090A0D" rx="1" />
    <rect x="261" y="294" width="8" height="16" fill="#090A0D" rx="1" />

    <!-- Right Building -->
    <path d="M 282,268 L 312,282 L 312,378 L 282,378 Z" fill="#FFFFFF" />
    <rect x="292" y="294" width="6" height="16" fill="#E52335" rx="1" />
    <rect x="292" y="320" width="6" height="18" fill="#E52335" rx="1" />

    <!-- SALT Plate -->
    <rect x="165" y="330" width="170" height="42" rx="6" fill="#090A0D" opacity="0.95" stroke="#F5D061" stroke-width="2" />
    <text x="250" y="362" font-family="'Outfit', 'Impact', Arial, sans-serif" font-weight="900" font-size="34" fill="#FFFFFF" text-anchor="middle" letter-spacing="6">
      SALT
    </text>

    <!-- Natural Sleeve Lighting Curve overlay -->
    <circle cx="250" cy="250" r="236" fill="url(#sleeveLighting)" pointer-events="none" />
  </g>
</svg>