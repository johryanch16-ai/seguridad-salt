<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%">
  <defs>
    <linearGradient id="emblemRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E52335" />
      <stop offset="100%" stop-color="#B01221" />
    </linearGradient>
    <linearGradient id="emblemSilver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="35%" stop-color="#C5C9D3" />
      <stop offset="70%" stop-color="#E2E5EC" />
      <stop offset="100%" stop-color="#8E94A0" />
    </linearGradient>
    <filter id="emblemGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#D31A2B" flood-opacity="0.35" />
    </filter>
    <clipPath id="emblem-circle-clip">
      <circle cx="160" cy="160" r="140" />
    </clipPath>
  </defs>

  <!-- Circular Outer Metallic Bevel -->
  <circle cx="160" cy="160" r="148" fill="#0C0D12" stroke="url(#emblemSilver)" stroke-width="4" filter="url(#emblemGlow)" />
  <circle cx="160" cy="160" r="143" fill="none" stroke="#D31A2B" stroke-width="1.5" opacity="0.8" />

  <!-- Circular Badge Body -->
  <g clip-path="url(#emblem-circle-clip)">
    <!-- Left Half: Crimson Red with Rich Gradient -->
    <path d="M 160,20 A 140,140 0 0,0 160,300 Z" fill="url(#emblemRed)" />
    <!-- Right Half: Dark Obsidian -->
    <path d="M 160,20 A 140,140 0 0,1 160,300 Z" fill="#0E1015" />
    
    <!-- White Horizon Swoosh Arc -->
    <path d="M 20,225 Q 160,175 300,225 Q 160,185 20,225 Z" fill="#FFFFFF" />

    <!-- Skyline / Buildings in Perspective -->
    <!-- Left Building -->
    <path d="M 85,205 L 122,192 L 122,300 L 85,290 Z" fill="#0E1015" />
    <path d="M 122,192 L 138,198 L 138,300 L 122,300 Z" fill="#FFFFFF" />
    <rect x="97" y="215" width="8" height="20" fill="#E52335" rx="1" />
    <rect x="97" y="245" width="8" height="24" fill="#E52335" rx="1" />

    <!-- Center Main Skyscraper -->
    <path d="M 138,135 L 165,118 L 165,300 L 138,300 Z" fill="#0E1015" />
    <path d="M 165,118 L 195,135 L 195,300 L 165,300 Z" fill="#FFFFFF" />
    <rect x="172" y="152" width="9" height="18" fill="#0E1015" rx="1" />
    <rect x="172" y="180" width="9" height="18" fill="#0E1015" rx="1" />
    <rect x="172" y="208" width="9" height="18" fill="#0E1015" rx="1" />

    <!-- Right Building -->
    <path d="M 195,178 L 228,195 L 228,300 L 195,300 Z" fill="#FFFFFF" />
    <rect x="207" y="208" width="8" height="20" fill="#E52335" rx="1" />
    <rect x="207" y="238" width="8" height="22" fill="#E52335" rx="1" />
  </g>
  
  <!-- Subtle Inner Ring Highlight -->
  <circle cx="160" cy="160" r="140" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" />
</svg>
