<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <clipPath id="circle-clip">
      <circle cx="250" cy="180" r="140" />
    </clipPath>
  </defs>

  <!-- Emblem Group with Circular Clip -->
  <g clip-path="url(#circle-clip)">
    <!-- Left Half: Crimson Red -->
    <path d="M 250,40 A 140,140 0 0,0 250,320 Z" fill="#C81D25" />
    <!-- Right Half: Jet Black -->
    <path d="M 250,40 A 140,140 0 0,1 250,320 Z" fill="#111114" />
    
    <!-- White Horizon Swoosh Arc -->
    <path d="M 110,240 Q 250,195 390,240 Q 250,205 110,240 Z" fill="#FFFFFF" />

    <!-- Skyline / Buildings -->
    <!-- Left Building (Black with Red Windows) -->
    <path d="M 175,225 L 210,215 L 210,310 L 175,300 Z" fill="#111114" />
    <path d="M 210,215 L 225,220 L 225,315 L 210,310 Z" fill="#FFFFFF" />
    <!-- Left Building Windows -->
    <rect x="187" y="235" width="8" height="18" fill="#C81D25" rx="1" />
    <rect x="187" y="262" width="8" height="22" fill="#C81D25" rx="1" />

    <!-- Center Main Skyscraper (Tallest, Black & White) -->
    <path d="M 225,160 L 255,145 L 255,320 L 225,315 Z" fill="#111114" />
    <path d="M 255,145 L 285,160 L 285,320 L 255,320 Z" fill="#FFFFFF" />
    <!-- Center Windows on White Face -->
    <rect x="263" y="175" width="8" height="15" fill="#111114" rx="1" />
    <rect x="263" y="200" width="8" height="15" fill="#111114" rx="1" />
    <rect x="263" y="225" width="8" height="15" fill="#111114" rx="1" />

    <!-- Right Building (White Face, Red Windows) -->
    <path d="M 285,200 L 315,215 L 315,310 L 285,320 Z" fill="#FFFFFF" />
    <!-- Right Windows -->
    <rect x="296" y="225" width="8" height="16" fill="#C81D25" rx="1" />
    <rect x="296" y="252" width="8" height="18" fill="#C81D25" rx="1" />
  </g>

  <!-- Typography -->
  <!-- SEGURIDAD -->
  <text x="250" y="380" 
        text-anchor="middle" 
        font-family="'Montserrat', 'Outfit', 'Helvetica Neue', Arial, sans-serif" 
        font-size="28" 
        font-weight="800" 
        letter-spacing="14" 
        fill="#C81D25">SEGURIDAD</text>

  <!-- SALT -->
  <text x="250" y="465" 
        text-anchor="middle" 
        font-family="'Montserrat', 'Outfit', 'Arial Black', sans-serif" 
        font-size="94" 
        font-weight="900" 
        letter-spacing="2" 
        fill="#C81D25">SALT</text>
</svg>
