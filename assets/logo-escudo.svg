<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 400 480" width="400" height="480">
  <defs>
    <!-- Metallic Silver Gradient -->
    <linearGradient id="silverTrim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="25%" stop-color="#C5C9D3" />
      <stop offset="50%" stop-color="#E2E5EC" />
      <stop offset="75%" stop-color="#8E94A0" />
      <stop offset="100%" stop-color="#DCDFE5" />
    </linearGradient>

    <!-- Crimson Red Gradient -->
    <linearGradient id="crimsonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E52335" />
      <stop offset="100%" stop-color="#B01221" />
    </linearGradient>

    <!-- Dark Obsidian Shield Body -->
    <linearGradient id="obsidianGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A1C23" />
      <stop offset="100%" stop-color="#0B0C10" />
    </linearGradient>

    <!-- Drop Shadow for 3D realism -->
    <filter id="patchShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.65" />
    </filter>

    <!-- Inner Shield Clip -->
    <clipPath id="innerShieldClip">
      <path d="M 200,32 C 290,32 360,42 360,95 C 360,250 290,370 200,432 C 110,370 40,250 40,95 C 40,42 110,32 200,32 Z" />
    </clipPath>

    <!-- Center Emblem Circle Clip -->
    <clipPath id="emblemCircle">
      <circle cx="200" cy="225" r="92" />
    </clipPath>
  </defs>

  <!-- Filter Shadow Wrapper -->
  <g filter="url(#patchShadow)">
    <!-- 1. Outer Embroidered Border (Heraldic Shield) -->
    <path d="M 200,20 C 305,20 380,32 380,95 C 380,265 305,395 200,460 C 95,395 20,265 20,95 C 20,32 95,20 200,20 Z" 
          fill="#0F1115" stroke="url(#silverTrim)" stroke-width="8" stroke-linejoin="round" />

    <!-- 2. Second Stitched Border (Crimson Accent Line) -->
    <path d="M 200,28 C 296,28 368,38 368,95 C 368,256 296,380 200,444 C 104,380 32,256 32,95 C 32,38 104,28 200,28 Z" 
          fill="none" stroke="#D31A2B" stroke-width="4" stroke-dasharray="8,3" />

    <!-- 3. Shield Body -->
    <path d="M 200,32 C 290,32 360,42 360,95 C 360,250 290,370 200,432 C 110,370 40,250 40,95 C 40,42 110,32 200,32 Z" 
          fill="url(#obsidianGrad)" />

    <!-- 4. Top Arch Header: "SEGURIDAD" -->
    <path d="M 60,110 C 120,72 280,72 340,110 L 340,55 C 280,38 120,38 60,55 Z" fill="#D31A2B" />
    <path d="M 60,110 C 120,72 280,72 340,110" fill="none" stroke="url(#silverTrim)" stroke-width="2" />
    <path id="archTextPath" d="M 75,94 Q 200,60 325,94" fill="none" />
    
    <text font-family="'Outfit', 'Impact', sans-serif" font-weight="900" font-size="25" fill="#FFFFFF" letter-spacing="4.5">
      <textPath xlink:href="#archTextPath" href="#archTextPath" startOffset="50%" text-anchor="middle">
        SEGURIDAD
      </textPath>
    </text>

    <!-- 5. Center Round Emblem of SALT with Buildings -->
    <!-- Outer Ring for Emblem -->
    <circle cx="200" cy="225" r="96" fill="#0B0C10" stroke="url(#silverTrim)" stroke-width="3.5" />
    
    <g clip-path="url(#emblemCircle)">
      <!-- Left Half: Crimson Red -->
      <path d="M 200,133 A 92,92 0 0,0 200,317 Z" fill="url(#crimsonGrad)" />
      <!-- Right Half: Dark Obsidian -->
      <path d="M 200,133 A 92,92 0 0,1 200,317 Z" fill="#0A0B0E" />

      <!-- White Horizon Curve -->
      <path d="M 108,268 Q 200,235 292,268 Q 200,242 108,268 Z" fill="#FFFFFF" />

      <!-- Left Building (Dark with Red Windows) -->
      <path d="M 150,254 L 175,245 L 175,317 L 150,310 Z" fill="#0A0B0E" />
      <path d="M 175,245 L 186,249 L 186,317 L 175,317 Z" fill="#FFFFFF" />
      <rect x="158" y="260" width="5" height="13" fill="#D31A2B" rx="1" />
      <rect x="158" y="280" width="5" height="15" fill="#D31A2B" rx="1" />

      <!-- Center Main Tower (Tallest Skyscraper) -->
      <path d="M 186,208 L 204,196 L 204,317 L 186,317 Z" fill="#0A0B0E" />
      <path d="M 204,196 L 224,208 L 224,317 L 204,317 Z" fill="#FFFFFF" />
      <rect x="208" y="218" width="6" height="12" fill="#0A0B0E" rx="1" />
      <rect x="208" y="237" width="6" height="12" fill="#0A0B0E" rx="1" />
      <rect x="208" y="256" width="6" height="12" fill="#0A0B0E" rx="1" />

      <!-- Right Building (White with Red Windows) -->
      <path d="M 224,236 L 246,247 L 246,317 L 224,317 Z" fill="#FFFFFF" />
      <rect x="232" y="256" width="5" height="13" fill="#D31A2B" rx="1" />
      <rect x="232" y="276" width="5" height="14" fill="#D31A2B" rx="1" />
    </g>

    <!-- 6. Bottom Banner: "SALT" -->
    <!-- Banner Ribbon Background -->
    <path d="M 70,335 L 330,335 L 345,385 L 200,410 L 55,385 Z" fill="#D31A2B" stroke="url(#silverTrim)" stroke-width="2.5" />
    
    <!-- Bold Main Text "SALT" -->
    <text x="200" y="375" 
          font-family="'Outfit', 'Arial Black', sans-serif" 
          font-weight="900" 
          font-size="40" 
          fill="#FFFFFF" 
          text-anchor="middle" 
          letter-spacing="5">
      SALT
    </text>

    <!-- Subtitle: "PRIVADA • COSTA RICA" -->
    <text x="200" y="398" 
          font-family="'Plus Jakarta Sans', sans-serif" 
          font-weight="800" 
          font-size="10.5" 
          fill="url(#silverTrim)" 
          text-anchor="middle" 
          letter-spacing="3.5">
      PRIVADA • COSTA RICA
    </text>

    <!-- Golden Stars / Security Emblems -->
    <polygon points="105,364 108,373 117,373 110,378 112,387 105,382 98,387 100,378 93,373 102,373" fill="url(#silverTrim)" />
    <polygon points="295,364 298,373 307,373 300,378 302,387 295,382 288,387 290,378 283,373 292,373" fill="url(#silverTrim)" />
  </g>
</svg>
